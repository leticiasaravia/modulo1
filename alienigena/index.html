<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício do Alien</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style> 
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; } 
    </style>
</head>

<body>
    <script>
        const larguraJogo = 700;
        const alturaJogo = 850;

        // Configuração do jogo
        const config = {
            type: Phaser.AUTO,
            width: larguraJogo,
            height: alturaJogo,

            // Ativando a física no jogo
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: true // Ativa o modo de depuração para ver colisões e limites
                }
            },

            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        // Inicializa o jogo
        const game = new Phaser.Game(config);

        // Variáveis globais
        var fogo;
        var alien;
        var teclado;
        var plataforma;
        var placar;
        var pontuacao = 0;  // Inicializando a pontuação

        function preload() {
            this.load.image('background', 'assets/bg.png');
            this.load.image('player', 'assets/alienigena.png'); // Carrega o alienígena
            this.load.image('turbo_nave', 'assets/turbo.png');
            this.load.image('plataforma_tijolo', 'assets/tijolos.png');
            this.load.image('moeda', 'assets/moeda.png');
            this.load.image('homem', 'assets/homem.png');
        }

        function create() {
            // Adiciona a imagem de fundo
            this.add.image(larguraJogo / 2, alturaJogo / 2, 'background');

            // Adiciona o foguinho do turbo na posição inicial do alien
            fogo = this.add.sprite(0 , 0 , 'turbo_nave');
            fogo.setVisible(false);


            // Cria o alienígena no topo da tela
            alien = this.physics.add.sprite(larguraJogo / 2, 0, 'player');
            alien.setCollideWorldBounds(true); // Define colisão com os limites do mundo



            // Configura o teclado para movimentação
            teclado = this.input.keyboard.createCursorKeys();

            // Add plataforma
            plataforma = this.physics.add.staticImage(larguraJogo/8, alturaJogo/2, 'plataforma_tijolo');
            this.physics.add.collider(alien, plataforma)
            

            // Add Homem Aranha (Spider-Man)
         homem = this.physics.add.sprite(larguraJogo / 2, alturaJogo / 8, 'homem');
         homem.setCollideWorldBounds(true);

            // Set the scale of the image
         homem.setScale(0.2, 0.2);

            // Adjust the collision box size if needed
         homem.body.setSize(homem.width * 1, homem.height * 1);

           // Add a collider between the alien and Homem Aranha
            this.physics.add.collider(alien, homem);


            // Add moeda
            var moeda = this.physics.add.sprite(larguraJogo/2, 0, 'moeda');
            moeda.setCollideWorldBounds(true);
            moeda.setBounce(0.7);
            this.physics.add.collider(moeda, plataforma);

            // adicionando placar
            placar = this.add.text(50, 50, 'Moedas: ' + pontuacao, { fontSize: '45px', fill: '#495613' });

            this.physics.add.overlap(alien, moeda, function() {
                moeda.setVisible(false);

                var posicaoMoeda_X = Phaser.Math.RND.between(50, 750); // Alterei para um intervalo X
                var posicaoMoeda_Y = Phaser.Math.RND.between(50, 650); // Intervalo Y já estava correto

                moeda.setPosition(posicaoMoeda_X, posicaoMoeda_Y); // Definindo as novas posições X e Y da moeda

                pontuacao += 1;

                placar.setText('Moedas: ' + pontuacao);

                moeda.setVisible(true);
            });
            
        }

        function update() {
            
            if (teclado.left.isDown) {  
                alien.setVelocityX(-150);  
            }  
            else if (teclado.right.isDown) {  
                alien.setVelocityX(150);  
            }  
            else {  
                alien.setVelocityX(0);  
            }  

            if (teclado.up.isDown) {  
                alien.setVelocityY(-150);  
                ativarTurbo();  
            }  
            else {  
                semTurbo();  
            }  
        }

        function ativarTurbo() {  
            fogo.setVisible(true);
            fogo.setPosition(alien.x, alien.y + alien.height / 2); // Atualiza a posição corretamente
        }  

        function semTurbo() {  
            fogo.setVisible(false);  
        }  
    </script>
</body>
</html>
